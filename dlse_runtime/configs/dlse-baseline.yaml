# Baseline serving configuration used for A/B comparison.
backend: pytorch
max_batch_size: 8
max_seq_len: 4096
max_num_tokens: 8192

# Chunked prefill and CUDA Graph settings are intentionally omitted.
kv_cache_config:
  enable_block_reuse: false

pytorch_backend_config:
  enable_iter_perf_stats: true
